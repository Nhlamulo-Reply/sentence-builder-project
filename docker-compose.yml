services:


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sentence-builder-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SentenceBuilder123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
#    healthcheck:
#      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SentenceBuilder123!' -C -Q 'SELECT 1' || exit 1" ]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sentence-builder-backend
    ports:
      - "5010:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WordBuilderDB;User Id=sa;Password=SentenceBuilder123!;TrustServerCertificate=True;"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./FrontEnd/client
      dockerfile: Dockerfile
    container_name: sentence-builder-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlserver_data: