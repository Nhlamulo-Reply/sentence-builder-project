<div class="card shadow-sm">

  <div class="card-header bg-white">

    <h5 class="mb-0">
      <i class="bi bi-clock-history"></i>
      My Sentences
    </h5>
  </div>


  <div class="card-body p-0">
    <div class="table-responsive">
      <table  mat-table
        [dataSource]="dataSource"
        class="w-100">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let sentence">{{ sentence.id }} </td>
        </ng-container>

        <ng-container matColumnDef="text">
          <th mat-header-cell *matHeaderCellDef> Sentence </th>
          <td mat-cell *matCellDef="let sentence">
            {{ sentence.text }}
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef> Created </th>
          <td mat-cell *matCellDef="let sentence">
            {{ sentence.createdAt | date:'dd/MM/yyyy HH:mm' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let sentence">
            <button mat-raised-button color="primary"
              (click)="editModal(sentence)">
              <i class="bi bi-pencil"></i>
              Edit
            </button>
          </td>
        </ng-container>

        <tr  mat-header-row *matHeaderRowDef="displayedColumns"> </tr>

        <tr mat-row *matRowDef=" let row; columns: displayedColumns;"></tr>

        @if (dataSource.data.length === 0) {
          <tr>
            <td colspan="4" class="text-center py-4">
              No sentences found.
            </td>
          </tr>
        }

      </table>

    </div>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>


@if (selectedSentenceId !== null) {

  <div class="modal fade show" tabindex="-1" style=" display: block; background: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
       <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-pencil"></i>
            Edit Sentence
          </h5>

          <button type="button" class="btn-close"
            (click)="closeModal()">
          </button>
        </div>

        <div class="modal-body">
          <app-edit-sentence-modal
            [sentenceId]="selectedSentenceId"
            (saved)="sentenceUpdated()">
          </app-edit-sentence-modal>
        </div>

      </div>

    </div>

  </div>

}
