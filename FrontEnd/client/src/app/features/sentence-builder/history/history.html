<div class="card">
  <div class="card-header">
    <h4>Sentence History</h4>
  </div>

  <div class="card-body">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 w-100">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          ID
        </th>

        <td mat-cell *matCellDef="let sentence">
          {{ sentence.id }}
        </td>

      </ng-container>
      <!-- Sentence -->
      <ng-container matColumnDef="text">
        <th mat-header-cell *matHeaderCellDef>
          Sentence
        </th>

        <td mat-cell *matCellDef="let sentence">
          {{ sentence.text }}
        </td>

      </ng-container>
      <!-- Created -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>
          Created
        </th>

        <td mat-cell *matCellDef="let sentence">
          {{ sentence.createdAt | date:'short' }}
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let sentence">
          <button mat-raised-button color="primary" (click)="edit(sentence)">
            Edit
          </button>
       </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5,10,20]">
    </mat-paginator>

  </div>

</div>
