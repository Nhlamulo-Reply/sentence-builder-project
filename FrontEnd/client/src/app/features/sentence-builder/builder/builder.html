<div class="card shadow-sm">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold" style="color: #1f3d6b;">
      <i class="bi bi-box"></i> Build your sentence
    </span>
    <span class="badge-lexi">select words</span>
  </div>
  <div class="card-body">

    <!-- Word type selector -->
    <div class="d-flex align-items-center gap-3 flex-wrap mb-3">
      <span class="fw-semibold" style="color: #2d4a77; font-size: 0.9rem;">Select Word Type</span>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary-custom active" style="background:#e9f0fa;">Noun</button>
        <button class="btn btn-sm btn-outline-secondary-custom">Verb</button>
        <button class="btn btn-sm btn-outline-secondary-custom">Adjective</button>
      </div>
    </div>

    <!-- Available words -->
    <div class="mb-3">
      <span class="fw-semibold" style="color: #2d4a77; font-size: 0.85rem;">Available Words</span>
      <div class="word-grid mt-2 d-flex flex-wrap">
        <span class="word-pill" *ngFor="let word of availableWords" (click)="addWord(word)">
          {{ word }}
        </span>
      </div>
      <div class="text-muted small mt-1">
        <i class="bi bi-hand-index-thumb"></i> Click on a word to add it to your sentence.
      </div>
    </div>

    <!-- Current sentence -->
    <div class="bg-light p-3 rounded-4" style="background: #f8faff !important; border: 1px solid #e9eff6;">
      <div class="d-flex justify-content-between align-items-start flex-wrap">
        <span class="fw-semibold" style="color: #2d4a77; font-size: 0.9rem;">
          <i class="bi bi-pencil"></i> Current Sentence
        </span>
        <button class="clear-btn" (click)="clearSentence()">
          <i class="bi bi-eraser"></i> Clear
        </button>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-1 mt-2">
        <span class="sentence-token" *ngFor="let word of currentSentence">
          {{ word }}
        </span>
        <span *ngIf="currentSentence.length === 0" class="text-muted">Start building your sentence...</span>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-sm btn-primary" style="background:#1f3d6b; border:none; border-radius:40px; padding:0.3rem 1.5rem;" (click)="saveSentence()">
          <i class="bi bi-plus-lg"></i> Save Sentence
        </button>
        <button class="btn btn-sm btn-outline-secondary" style="border-radius:40px;" (click)="resetSentence()">Reset</button>
      </div>
    </div>

  </div>
</div>
