<div class="container mt-4">

  <div class="row mb-4">
    <div class="col-12">
      <div class="card bg-primary text-white shadow-sm">
        <div class="card-body">
          <h2 class="mb-1">Welcome back, {{ username }}! </h2>
          <p class="mb-0">Start building your sentences using the navigation below.</p>
        </div>
      </div>
    </div>
  </div>


  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h5 class="mb-0" style="color: #1f3d6b;">
            <i class="bi bi-compass"></i> Quick Navigation
          </h5>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-6">
              <div class="card h-100 text-center border-0 shadow-sm">
                <div class="card-body">
                  <i class="bi bi-pencil-square fs-1 text-primary"></i>
                  <h5 class="mt-2">Sentence Builder</h5>
                  <p class="text-muted small">Build sentences by selecting words</p>
                  <a routerLink="/builder" class="btn btn-primary btn-sm">
                    Go to Builder
                  </a>
                </div>
              </div>
            </div>

            <!-- History -->
            <div class="col-md-6">
              <div class="card h-100 text-center border-0 shadow-sm">
                <div class="card-body">
                  <i class="bi bi-clock-history fs-1 text-success"></i>
                  <h5 class="mt-2">Sentence History</h5>
                  <p class="text-muted small">View all your saved sentences</p>
                  <a routerLink="/history" class="btn btn-success btn-sm">
                    View History
                  </a>
                </div>
              </div>
            </div>


          </div>
        </div>
      </div>
    </div>
  </div>

</div>
