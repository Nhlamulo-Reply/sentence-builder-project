<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-center mb-4" style="color: #1f3d6b;">
            <i class="bi bi-pencil-square"></i> LexiCraft
          </h3>
          <h5 class="text-center mb-4">Sign In</h5>

          <form (ngSubmit)="login()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                name="email"
                [(ngModel)]="credentials.email"
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                name="password"
                [(ngModel)]="credentials.password"
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password">
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background:#1f3d6b; border:none;">
              Sign In
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="#" class="text-decoration-none" style="color: #1f3d6b;">Forgot password?</a>
          </div>
          <hr>
          <div class="text-center">
            <span class="text-muted">Don't have an account?</span>
            <a href="#" class="text-decoration-none ms-1" style="color: #1f3d6b;">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
